name: CI

on:
  push:
    branches:
      - main
      - time-transfer-law
      - 'claude/**'
  pull_request:
    branches:
      - main
      - time-transfer-law

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  contracts-core:
    name: Core contracts
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Foundation contract
        run: npm run test:agent-buccet:foundation
      - name: Time-runtime contract
        run: npm run test:agent-buccet:time-runtime
      - name: Law unit tests
        run: npm run test:agent-buccet:law-unit
      - name: Gravity contract
        run: npm run test:agent-buccet:gravity-contract
      - name: Ledger contract
        run: npm run test:agent-buccet:ledger-contract
      - name: LIOPE contract
        run: npm run test:agent-buccet:liope-contract
      - name: Wrapper contract
        run: npm run test:agent-buccet:wrapper-contract
      - name: Intercept daemon contract
        run: npm run test:agent-buccet:intercept-daemon
      - name: Release witness contract
        run: npm run test:agent-buccet:release-witness
        env:
          AGENT_BUCCET_WITNESS_FILE: /tmp/buccet-ci-witness.checkpoints.jsonl
      - name: Chat boundary contract
        run: npm run test:agent-buccet:chat-boundary
      - name: UPL governance contract
        run: npm run test:agent-buccet:upl-governance
      - name: Egress classification contract
        run: npm run test:agent-buccet:egress-contract
      - name: Resource governor contract
        run: npm run test:agent-buccet:governor-contract
      - name: Input admission boundary contract
        run: npm run test:agent-buccet:admission-contract
      - name: Admission hard block ceiling contract
        run: npm run test:agent-buccet:admission-hardcap-contract

  contracts-ledger:
    name: Ledger contracts
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Ledger rollup contract
        run: npm run test:agent-buccet:ledger-rollup
      - name: Signed ledger content forgery regression
        run: node contracts/proof/agent-buccet-ledger-content-integrity.mjs
      - name: Ledger writer contract
        run: npm run test:agent-buccet:ledger-writer
      - name: Ledger witness contract
        run: npm run test:agent-buccet:ledger-witness

  contracts-runtime:
    name: Runtime contracts
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Compile native intercept layer
        run: sh native/deep-intercept/build.sh native/deep-intercept/build
      - name: Compile native physwrap enforcer
        run: npm run build:native:physwrap
      - name: Action classes contract
        run: npm run test:agent-buccet:action-classes
      - name: Swarm contract
        run: npm run test:agent-buccet:swarm
      - name: Gravity supervisor contract
        run: npm run test:agent-buccet:gravity-supervisor
      - name: Payload physics contract
        run: npm run test:agent-buccet:payload-physics-contract
      - name: Attack demo
        run: npm run demo:agent-buccet:attacks
      - name: Transport isolation contract
        run: npm run test:agent-buccet:transport

  contracts-docs:
    name: Docs and hygiene contracts
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Doc links contract
        run: npm run test:agent-buccet:doc-links
      - name: Artifact hygiene contract
        run: npm run test:agent-buccet:artifact-hygiene
      - name: Quickstart example
        run: npm run demo:quickstart
