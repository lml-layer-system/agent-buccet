name: Buccet adversarial MCP execution tests

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/buccet-box/adversarial-mcp.mjs"
      - "apps/buccet-box/adversarial-ledger.mjs"
      - "apps/buccet-box/approval-flood.test.mjs"
      - "apps/buccet-box/backend.mjs"
      - "scripts/agent-buccet-mcp-server.ts"
      - "native/box-fs-guard.c"
      - "scripts/build-box-fs-guard.sh"
      - "src/**"
      - ".github/workflows/box-adversarial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redteam:
    name: Attack actual MCP execution boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build native confined filesystem actuator
        run: sh scripts/build-box-fs-guard.sh
      - name: Run adversarial MCP actions in disposable workspace
        timeout-minutes: 8
        run: |
          node apps/buccet-box/adversarial-mcp.mjs
          node --test apps/buccet-box/safe-http.test.mjs

  box-approval-pressure:
    name: Attack Box approval capacity and cancellation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run real local HTTP approval flood in isolated home
        run: node --test apps/buccet-box/approval-flood.test.mjs

  proof-integrity:
    name: Attack signed proof contents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Mutate signed receipts in isolated ledger
        run: node apps/buccet-box/adversarial-ledger.mjs
