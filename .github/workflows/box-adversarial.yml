name: Buccet adversarial MCP execution tests

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/buccet-box/adversarial-mcp.mjs"
      - "apps/buccet-box/adversarial-ledger.mjs"
      - "scripts/agent-buccet-mcp-server.ts"
      - "native/box-fs-guard.c"
      - "scripts/build-box-fs-guard.sh"
      - "src/**"
      - ".github/workflows/box-adversarial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redteam:
    name: Attack actual MCP execution boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build shipped native actuator and verify it denies same-user mutation
        run: |
          sh scripts/build-box-fs-guard.sh
          node apps/buccet-box/native-guard-default-deny.mjs
      - name: Compile explicitly UNSAFE disposable actuator only for legacy MCP behavioral controls
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -D_FILE_OFFSET_BITS=64 \
            -DBUCCET_INSECURE_TEST_ONLY native/box-fs-guard.c -o native/build/box-fs-guard
      - name: Run adversarial MCP actions in disposable workspace
        timeout-minutes: 8
        run: |
          node apps/buccet-box/adversarial-mcp.mjs
          node --test apps/buccet-box/safe-http.test.mjs

  proof-integrity:
    name: Attack signed proof contents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Mutate signed receipts in isolated ledger
        run: node apps/buccet-box/adversarial-ledger.mjs
