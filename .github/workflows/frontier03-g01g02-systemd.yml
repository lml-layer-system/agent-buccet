name: Frontier03 G01-G02 actual systemd failures

on:
  push:
    branches:
      - "security/frontier03-g01g02-attack-20261114"
    paths:
      - ".github/workflows/frontier03-g01g02-systemd.yml"
      - "apps/buccet-box/frontier03-service-lifecycle.mjs"
      - "apps/buccet-box/frontier03-native-commit-faults.mjs"
      - "apps/buccet-box/frontier03-native-fault-interposer.c"
      - "apps/buccet-box/frontier03-test-guard-wrapper.c"
      - "apps/buccet-box/frontier03-broker-uncertain-receipts.mjs"
      - "native/box-fs-guard.c"
      - "scripts/provision-native-broker.sh"
      - "scripts/provision-native-operator-gate.sh"
      - "native/box-fs-broker.mjs"
      - "native/box-fs-approval-gate.mjs"
  pull_request:
    paths:
      - ".github/workflows/frontier03-g01g02-systemd.yml"
      - "apps/buccet-box/frontier03-service-lifecycle.mjs"
      - "apps/buccet-box/frontier03-native-commit-faults.mjs"
      - "apps/buccet-box/frontier03-native-fault-interposer.c"
      - "apps/buccet-box/frontier03-test-guard-wrapper.c"
      - "apps/buccet-box/frontier03-broker-uncertain-receipts.mjs"
      - "native/box-fs-guard.c"
      - "scripts/provision-native-broker.sh"
      - "scripts/provision-native-operator-gate.sh"
      - "native/box-fs-broker.mjs"
      - "native/box-fs-approval-gate.mjs"

permissions:
  contents: read

jobs:
  actual-systemd-lifecycle:
    name: G01-G02 actual systemd crash and authorized recovery (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build real shipped native C guard
        run: sh scripts/build-box-fs-guard.sh
      - name: Confirm systemd host environment (no mock service accepted)
        run: |
          systemctl --version
          sudo systemctl list-unit-files --type service --no-pager >/dev/null
      - name: Force actual native commit-window SIGKILL, fsync EIO and unsafe mutant detection
        run: node apps/buccet-box/frontier03-native-commit-faults.mjs
      - name: Verify real broker denial versus uncertain receipts under native faults
        run: node apps/buccet-box/frontier03-broker-uncertain-receipts.mjs
      - name: Attack actual broker and gate service death; test kernel isolation and authorized effects
        run: node apps/buccet-box/frontier03-service-lifecycle.mjs
