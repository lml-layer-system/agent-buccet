name: Native filesystem isolation frontier

on:
  push:
    branches:
      - "security/frontier-rebased-main-20261113"
    paths:
      - "native/box-fs-guard.c"
      - "apps/buccet-box/frontier-races.mjs"
      - "apps/buccet-box/frontier-rename-barrier.c"
      - "apps/buccet-box/native-isolation-probe.mjs"
      - "native/box-fs-broker.mjs"
      - "apps/buccet-box/native-operator-install.test.mjs"
      - "scripts/provision-native-operator-gate.sh"
      - "native/box-fs-operator-review.mjs"
      - "native/box-fs-host-enroll.mjs"
      - "apps/buccet-box/native-host-enroll.test.mjs"
      - "native/box-fs-approval-gate.mjs"
      - "native/box-fs-policy-controller.mjs"
      - "native/box-fs-broker-client.mjs"
      - "apps/buccet-box/native-broker-probe.mjs"
      - "apps/buccet-box/native-broker-api-test.mjs"
      - "apps/buccet-box/fs-default-deny.test.mjs"
      - "apps/buccet-box/native-guard-default-deny.mjs"
      - "apps/buccet-box/native-provision.test.mjs"
      - "scripts/provision-native-broker.sh"
      - "apps/buccet-box/native-production-controller.mjs"
      - "apps/buccet-box/frontier-protected-races.mjs"
      - "src/box/confined-fs.ts"
      - "src/box/protected-fs-broker.ts"
      - "src/box/protected-fs-gate.ts"
      - "src/box/host-attestation.ts"
      - "scripts/agent-buccet-mcp-server.ts"
      - "apps/buccet-box/native-operator-gate.test.mjs"
      - ".github/workflows/native-isolation-frontier.yml"
  pull_request:
    paths:
      - "native/box-fs-guard.c"
      - "apps/buccet-box/frontier-races.mjs"
      - "apps/buccet-box/frontier-rename-barrier.c"
      - "apps/buccet-box/native-isolation-probe.mjs"
      - "native/box-fs-broker.mjs"
      - "apps/buccet-box/native-operator-install.test.mjs"
      - "scripts/provision-native-operator-gate.sh"
      - "native/box-fs-operator-review.mjs"
      - "native/box-fs-host-enroll.mjs"
      - "apps/buccet-box/native-host-enroll.test.mjs"
      - "native/box-fs-approval-gate.mjs"
      - "native/box-fs-policy-controller.mjs"
      - "native/box-fs-broker-client.mjs"
      - "apps/buccet-box/native-broker-probe.mjs"
      - "apps/buccet-box/native-broker-api-test.mjs"
      - "apps/buccet-box/fs-default-deny.test.mjs"
      - "apps/buccet-box/native-guard-default-deny.mjs"
      - "apps/buccet-box/native-provision.test.mjs"
      - "scripts/provision-native-broker.sh"
      - "apps/buccet-box/native-production-controller.mjs"
      - "apps/buccet-box/frontier-protected-races.mjs"
      - "src/box/confined-fs.ts"
      - "src/box/protected-fs-broker.ts"
      - "src/box/protected-fs-gate.ts"
      - "src/box/host-attestation.ts"
      - "scripts/agent-buccet-mcp-server.ts"
      - "apps/buccet-box/native-operator-gate.test.mjs"
      - ".github/workflows/native-isolation-frontier.yml"

permissions:
  contents: read

jobs:
  native-commit-isolation:
    name: Production native guard must refuse user-owned mutable namespaces
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the shipped native guard (never the insecure diagnostic build)
        run: sh scripts/build-box-fs-guard.sh
      - name: Reject direct writes and moves from untrusted and privileged callers to mutable roots
        run: node apps/buccet-box/native-guard-default-deny.mjs

  legacy-direct-attack-sentinel:
    name: Explicit UNSAFE test build reproduces five known direct-guard races
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert vulnerability corpus remains real in the nonshipped legacy diagnostic
        shell: bash
        run: |
          set +e
          node apps/buccet-box/frontier-races.mjs --legacy-unsafe-control >legacy.log 2>&1
          code=$?
          set -e
          cat legacy.log
          test "$code" -ne 0
          grep -q 'FRONTIER_PASS positive control' legacy.log
          test "$(grep -c '^FRONTIER_BREACH ' legacy.log)" -eq 5
          echo 'LEGACY_UNSAFE_DIAGNOSTIC_PASS: five actual breaches retained ONLY in the explicitly insecure test build'

  secure-default-execution:
    name: Default filesystem behavior denies direct guard when broker is missing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify missing, incomplete or spoofed broker never grants direct write
        run: node --test apps/buccet-box/fs-default-deny.test.mjs

  independent-principal-probe:
    name: Verify OS denies same-UID agent mutation while broker principal can execute
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build native actuator
        run: sh scripts/build-box-fs-guard.sh
      - name: Exercise protected principal and legitimate write/append/move
        run: node apps/buccet-box/native-isolation-probe.mjs

  protected-broker-integration:
    name: Trusted filesystem broker + hostile socket/namespace exclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build native filesystem actuator
        run: sh scripts/build-box-fs-guard.sh
      - name: Exercise real guarded file effects through protected broker
        run: node apps/buccet-box/native-broker-probe.mjs

  production-protected-races:
    name: All five original commit races at protected production execution boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hold actual native renameat and attempt hostile mutation from untrusted UID
        run: node apps/buccet-box/frontier-protected-races.mjs

  deploy-protected-broker:
    name: Deploy signed-off code to root-owned workspace and test real isolated broker
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build native guard for protected installation
        run: sh scripts/build-box-fs-guard.sh
      - name: Verify digest pinning, service root, hostile access denial, and valid file effects
        run: node apps/buccet-box/native-provision.test.mjs

  operator-approved-mcp-filesystem:
    name: Unprivileged scoped executor requires independent exact root operator approval
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build production native guard
        run: sh scripts/build-box-fs-guard.sh
      - name: Run normal scoped FS API as unprivileged agent with root-only manual operator approval
        run: node apps/buccet-box/native-operator-gate.test.mjs

  privileged-operator-deployment:
    name: Pinned root-owned human reviewer and operator gate installation
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build shipped guarded actuator
        run: sh scripts/build-box-fs-guard.sh
      - name: Verify release artifact digests, operator rights and installer replay denial
        run: node apps/buccet-box/native-operator-install.test.mjs

  trusted-host-credential-enrollment:
    name: Root-owned host credential enrollment, OS-separated handoff and revocation
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove credential issuer, dedicated host UID, secret non-disclosure and revocation
        run: node apps/buccet-box/native-host-enroll.test.mjs
