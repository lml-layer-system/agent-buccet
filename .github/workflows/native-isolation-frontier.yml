name: Native filesystem isolation frontier

on:
  push:
    branches:
      - "security/frontier-rebased-main-20261113"
    paths:
      - "native/box-fs-guard.c"
      - "apps/buccet-box/frontier-races.mjs"
      - "apps/buccet-box/frontier-rename-barrier.c"
      - "apps/buccet-box/native-isolation-probe.mjs"
      - "native/box-fs-broker.mjs"
      - "native/box-fs-broker-client.mjs"
      - "apps/buccet-box/native-broker-probe.mjs"
      - ".github/workflows/native-isolation-frontier.yml"
  pull_request:
    paths:
      - "native/box-fs-guard.c"
      - "apps/buccet-box/frontier-races.mjs"
      - "apps/buccet-box/frontier-rename-barrier.c"
      - ".github/workflows/native-isolation-frontier.yml"

permissions:
  contents: read

jobs:
  native-commit-isolation:
    name: Attack actual native commit after hostile mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify original five races and real allowed write
        run: node apps/buccet-box/frontier-races.mjs

  independent-principal-probe:
    name: Verify OS denies same-UID agent mutation while broker principal can execute
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build native actuator
        run: sh scripts/build-box-fs-guard.sh
      - name: Exercise protected principal and legitimate write/append/move
        run: node apps/buccet-box/native-isolation-probe.mjs

  protected-broker-integration:
    name: Trusted filesystem broker + hostile socket/namespace exclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build native filesystem actuator
        run: sh scripts/build-box-fs-guard.sh
      - name: Exercise real guarded file effects through protected broker
        run: node apps/buccet-box/native-broker-probe.mjs
