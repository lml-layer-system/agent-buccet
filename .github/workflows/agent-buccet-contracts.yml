name: agent-buccet-contracts

on:
  push:
  pull_request:

jobs:
  stable-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: P0 doc and hygiene gates
        run: npm run check:agent-buccet:p0

      - name: Run stable contracts
        run: npm run check:agent-buccet:contracts-stable

      - name: Upload stable debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-buccet-stable-debug-${{ matrix.os }}
          path: |
            data/ledger/**
            data/agent-boundary/**
            dist/releases/**
            artifacts/**
          if-no-files-found: ignore

  observed-contracts:
    needs: stable-contracts
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run observed contracts with reliability metrics
        run: npm run check:agent-buccet:contracts-observed

      - name: Print observed summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/observed-contracts/report.json ]; then
            cat artifacts/observed-contracts/report.json
          else
            echo '{"observed_lane":true,"status":"no-report"}'
          fi

      - name: Upload observed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-buccet-observed-${{ matrix.os }}
          path: |
            artifacts/observed-contracts/**
            data/ledger/**
            data/agent-boundary/**
          if-no-files-found: ignore
