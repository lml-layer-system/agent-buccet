name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run typecheck
      - name: Core contracts
        run: |
          npm run test:agent-buccet:foundation
          npm run test:agent-buccet:time-runtime
          npm run test:agent-buccet:gravity-contract
          npm run test:agent-buccet:ledger-contract
          npm run test:agent-buccet:wrapper-contract
      - name: Build release package
        run: node scripts/prepare-agent-buccet-package.ts
        env:
          AGENT_BUCCET_WITNESS_FILE: dist/releases/witness/latest.checkpoints.jsonl
      - name: Compile standalone binaries
        run: |
          mkdir -p dist/releases/bin
          bun build --compile --target bun-linux-x64   scripts/buccet.ts --outfile dist/releases/bin/buccet-linux-x64
          bun build --compile --target bun-linux-arm64 scripts/buccet.ts --outfile dist/releases/bin/buccet-linux-arm64
          bun build --compile --target bun-darwin-x64  scripts/buccet.ts --outfile dist/releases/bin/buccet-darwin-x64
          bun build --compile --target bun-darwin-arm64 scripts/buccet.ts --outfile dist/releases/bin/buccet-darwin-arm64
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/releases/*.tar.gz
            dist/releases/latest.json
            dist/releases/bin/buccet-linux-x64
            dist/releases/bin/buccet-linux-arm64
            dist/releases/bin/buccet-darwin-x64
            dist/releases/bin/buccet-darwin-arm64
