name: Law Coverage Gap
description: Report a missing or incorrectly excluded law that creates a behavioral blind spot
labels: ["coverage-gap"]
body:
  - type: markdown
    attributes:
      value: |
        **Before filing a public issue:** if this gap could enable unsafe agent behavior,
        please report it privately via a GitHub security advisory or email (see SECURITY.md).
  - type: input
    id: family
    attributes:
      label: Law family affected
      description: Which family ID or family title (e.g., BUCCET.BASE.FAMILY.07 — Adversarial Robustness)
      placeholder: "BUCCET.BASE.FAMILY.XX"
    validations:
      required: true
  - type: input
    id: source-law-ids
    attributes:
      label: Source law ID(s)
      description: Source law identifiers from the corpus (e.g., LAW-0049196), if known
      placeholder: "LAW-XXXXXXX, LAW-YYYYYYY"
  - type: textarea
    id: description
    attributes:
      label: Description of the gap
      description: What behavioral coverage is missing or incorrect, and what it enables
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Corpus excerpts, verify output, or other supporting material
