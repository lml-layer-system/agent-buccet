name: Bug Report
description: Report a tooling bug in verify scripts, generators, or manifests
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Which component
      options:
        - verify-upstream-transfer.js
        - generate-active-law-body.js
        - generate-runtime-law-substrate.js
        - generate-base-law-families.js
        - generate-base-runtime-corpus.js
        - generate-time-law-family.js
        - generate-time-runtime-corpus.js
        - runtime/agent-buccet-law-substrate.js
        - manifest.json (active-law-body)
        - manifest.json (runtime-law-substrate)
        - UPSTREAM_TRANSFER_CONTRACT.json
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens — include full error output or verify output
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands to run, starting from a clean checkout
      placeholder: |
        1. git clone ...
        2. npm run verify:upstream-transfer
        3. ...
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "node --version output"
